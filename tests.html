<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Testes - Bloco de Isaac</title></head>
<body>
<pre id="out"></pre>
<script src="music.js"></script>
<script src="progress.js"></script>
<script src="game.js"></script>
<script>
(function () {
  const G = BlockGame;
  const results = [];
  const DT = 1 / 60;
  // armazenamento falso: os testes nunca mexem no progresso salvo de verdade
  const memStore = () => {
    const m = {};
    return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } };
  };
  G.setStorage(memStore());

  function test(name, fn) {
    try { fn(); results.push('PASS ' + name); }
    catch (e) { results.push('FAIL ' + name + ' -> ' + (e && e.message || e)); }
  }
  function assert(cond, msg) { if (!cond) throw new Error(msg || 'assert'); }
  function steps(s, seconds) { for (let i = 0; i < Math.round(seconds / DT); i++) G.update(s, DT); }
  function key(s, code, down) { G.setKey(s, code, down); }
  function fresh(seed) { const s = G.createState(seed || 1234); s.msg = null; return s; }
  function findRoom(s, type) { for (const k in s.rooms) if (s.rooms[k].type === type) return s.rooms[k]; }
  // tira os orbes de XP do chão (para o nível não subir no meio de um teste que não é sobre XP)
  function noXp(s) { const r = G.curRoom(s); r.pickups = r.pickups.filter(pk => pk.type !== 'xp'); }
  // Coloca o jogador numa sala (como se tivesse entrado nela)
  function goTo(s, room) {
    s.cur = { x: room.x, y: room.y };
    if (!room.visited) {
      room.visited = true;
      room.enemies = room.spawns.map(sp => G.makeEnemy(s, sp));
      if (!room.enemies.length) room.cleared = true;
    }
    s.tears = []; s.bullets = [];
  }
  const keyEvt = (type, code) => new KeyboardEvent(type, { code, bubbles: true });

  // ---------- Comandos (eventos de teclado) ----------
  test('keydown/keyup de teclado atualizam estado das teclas', () => {
    const s = fresh(); const t = new EventTarget(); G.bindInput(s, t);
    for (const c of ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']) {
      t.dispatchEvent(keyEvt('keydown', c)); assert(s.keys[c] === true, c + ' down');
      t.dispatchEvent(keyEvt('keyup', c)); assert(s.keys[c] === false, c + ' up');
    }
  });
  test('setas têm preventDefault (página não rola)', () => {
    const s = fresh(); const t = new EventTarget(); G.bindInput(s, t);
    const ev = new KeyboardEvent('keydown', { code: 'ArrowDown', cancelable: true });
    t.dispatchEvent(ev); assert(ev.defaultPrevented, 'não preveniu');
  });
  test('perder o foco solta todas as teclas', () => {
    const s = fresh(); const t = new EventTarget(); G.bindInput(s, t);
    t.dispatchEvent(keyEvt('keydown', 'KeyD')); t.dispatchEvent(new Event('blur'));
    assert(!s.keys.KeyD, 'tecla continuou presa');
  });

  // ---------- Movimento ----------
  const moves = { KeyD: [1, 0], KeyA: [-1, 0], KeyW: [0, -1], KeyS: [0, 1] };
  for (const code in moves) {
    test(code + ' move o bloco na direção certa', () => {
      const s = fresh(); const p = s.player; const x0 = p.x, y0 = p.y;
      key(s, code, true); steps(s, 0.5);
      const [dx, dy] = moves[code];
      if (dx) { assert((p.x - x0) * dx > 60, 'x mudou ' + (p.x - x0)); assert(Math.abs(p.y - y0) < 0.01, 'y mudou'); }
      if (dy) { assert((p.y - y0) * dy > 60, 'y mudou ' + (p.y - y0)); assert(Math.abs(p.x - x0) < 0.01, 'x mudou'); }
    });
  }
  test('diagonal não é mais rápida que reta', () => {
    const s = fresh(); const p = s.player; p.x = 300; p.y = 400;
    key(s, 'KeyW', true); key(s, 'KeyD', true); steps(s, 0.6);
    const v = Math.hypot(p.vx, p.vy);
    assert(Math.abs(v - p.speed) < p.speed * 0.02, 'vel ' + v);
  });
  test('soltar a tecla faz o bloco parar', () => {
    const s = fresh(); const p = s.player;
    key(s, 'KeyD', true); steps(s, 0.3); key(s, 'KeyD', false); steps(s, 0.6);
    assert(Math.hypot(p.vx, p.vy) < 1, 'ainda andando');
  });
  test('teclas opostas se anulam', () => {
    const s = fresh(); const p = s.player; const x0 = p.x;
    key(s, 'KeyA', true); key(s, 'KeyD', true); steps(s, 0.5);
    assert(Math.abs(p.x - x0) < 0.01, 'moveu');
  });
  test('parede segura o bloco fora da porta', () => {
    const s = fresh(); const p = s.player; p.x = G.IX0 + 100;
    key(s, 'KeyW', true); steps(s, 4);
    assert(Math.abs(p.y - (G.IY0 + p.size / 2)) < 0.01, 'y=' + p.y);
    assert(s.cur.x === 0 && s.cur.y === 0, 'saiu da sala');
  });

  // ---------- Tiro ----------
  const shots = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  for (const code in shots) {
    test(code + ' atira na direção certa', () => {
      const s = fresh(); key(s, code, true); G.update(s, DT);
      assert(s.tears.length === 1, 'lágrimas ' + s.tears.length);
      const t = s.tears[0], [dx, dy] = shots[code];
      if (dx) assert(Math.sign(t.vx) === dx && Math.abs(t.vy) < 1, 'vel ' + t.vx + ',' + t.vy);
      if (dy) assert(Math.sign(t.vy) === dy && Math.abs(t.vx) < 1, 'vel ' + t.vx + ',' + t.vy);
    });
  }
  test('cadência de tiro respeitada (3 tiros em 1s)', () => {
    const s = fresh(); let fired = 0; key(s, 'ArrowRight', true);
    for (let i = 0; i < 60; i++) { const n = s.tears.length; G.update(s, DT); if (s.tears.length > n) fired++; }
    assert(fired === 3, 'disparou ' + fired);
  });
  test('última seta apertada tem prioridade', () => {
    const s = fresh(); key(s, 'ArrowUp', true); key(s, 'ArrowLeft', true); G.update(s, DT);
    assert(s.tears[0].vx < 0, 'não foi para a esquerda');
  });
  test('lágrimas somem ao bater na parede', () => {
    const s = fresh(); key(s, 'ArrowRight', true); G.update(s, DT); key(s, 'ArrowRight', false);
    steps(s, 2); assert(s.tears.length === 0, 'restaram ' + s.tears.length);
  });

  // ---------- Pausa / morte / reinício ----------
  test('Esc pausa e despausa', () => {
    const s = fresh(); const p = s.player; const x0 = p.x;
    key(s, 'Escape', true); key(s, 'Escape', false); key(s, 'KeyD', true); steps(s, 0.5);
    assert(p.x === x0, 'moveu pausado');
    key(s, 'Escape', true); key(s, 'Escape', false); steps(s, 0.5);
    assert(p.x > x0, 'não voltou');
  });
  test('dano + invencibilidade temporária', () => {
    const s = fresh(); const room = G.curRoom(s); const p = s.player;
    room.enemies.push(G.makeEnemy(s, { type: 'grunt', x: p.x, y: p.y }));
    G.update(s, DT); assert(p.hp === p.maxHp - 1, 'hp ' + p.hp);
    G.update(s, DT); assert(p.hp === p.maxHp - 1, 'tomou dano durante invencibilidade');
  });
  test('morrer e apertar R reinicia', () => {
    const s = fresh(); s.player.hp = 1; const room = G.curRoom(s);
    room.enemies.push(G.makeEnemy(s, { type: 'grunt', x: s.player.x, y: s.player.y }));
    G.update(s, DT); assert(s.status === 'dead', s.status);
    key(s, 'KeyR', true);
    assert(s.status === 'playing' && s.player.hp === s.player.maxHp && s.floor === 1, 'não reiniciou');
  });

  // ---------- Salas e portas ----------
  test('passar pela porta aberta troca de sala', () => {
    const s = fresh(); const start = G.curRoom(s);
    const dir = Object.keys(start.doors)[0];
    const code = { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' }[dir];
    key(s, code, true);
    for (let i = 0; i < 400 && s.cur.x === 0 && s.cur.y === 0; i++) G.update(s, DT);
    const d = G.DIRS[dir];
    assert(s.cur.x === d.dx && s.cur.y === d.dy, 'não entrou: ' + JSON.stringify(s.cur));
    assert(G.curRoom(s).visited, 'sala não marcada');
  });
  test('portas trancadas enquanto há inimigos', () => {
    let s, room;
    for (let seed = 1; seed < 200; seed++) {
      s = fresh(seed);
      room = Object.values(s.rooms).find(r => r.type === 'normal' && r.spawns.length && r.doors.left && r.rocks.length === 0);
      if (room) break;
    }
    goTo(s, room); s.player.hp = 999;
    s.player.x = G.IX0 + 60; s.player.y = G.H / 2;
    room.enemies.forEach(e => { e.x = G.IX1 - 40; e.y = G.IY0 + 30; e.speed = 0; e.cd = 999; e.type = 'turret'; });
    key(s, 'KeyA', true); steps(s, 2);
    assert(s.cur.x === room.x && s.cur.y === room.y, 'saiu com inimigos vivos');
    assert(s.player.x >= G.IX0 + s.player.size / 2 - 0.01, 'atravessou a parede');
  });
  test('matar todos os inimigos limpa a sala', () => {
    const s = fresh(); const room = G.curRoom(s); room.cleared = false; const p = s.player;
    room.enemies.push(G.makeEnemy(s, { type: 'turret', x: p.x + 150, y: p.y }));
    room.enemies[0].cd = 999; s.rng = () => 0.99; // sem drops aleatórios
    key(s, 'ArrowRight', true); steps(s, 3);
    assert(room.enemies.length === 0, 'inimigo vivo hp=' + (room.enemies[0] && room.enemies[0].hp));
    assert(room.cleared, 'sala não liberada'); assert(s.kills === 1, 'kills ' + s.kills);
  });
  test('pedras bloqueiam o bloco', () => {
    const s = fresh(); const room = G.curRoom(s); const p = s.player;
    room.rocks.push({ x: p.x + 60, y: p.y - 20, w: 40, h: 40 });
    key(s, 'KeyD', true); steps(s, 1.5);
    assert(Math.abs(p.x - (room.rocks[0].x - p.size / 2)) < 0.01, 'x=' + p.x);
  });
  test('pegar item aplica o efeito', () => {
    const s = fresh(); const room = findRoom(s, 'item'); goTo(s, room);
    const id = room.item.id; const p = s.player; const before = JSON.stringify(p);
    p.x = room.item.x; p.y = room.item.y + 60; key(s, 'KeyW', true); steps(s, 1);
    assert(room.item.taken, 'não pegou'); assert(p.items.includes(id), 'sem item');
    assert(JSON.stringify(p) !== before, 'sem efeito');
  });
  test('coração cura', () => {
    const s = fresh(); const p = s.player; p.hp = 3;
    G.curRoom(s).pickups.push({ type: 'heart', x: p.x, y: p.y, size: 20 });
    G.update(s, DT); assert(p.hp === 5, 'hp ' + p.hp);
  });
  test('chefão derrotado abre alçapão e leva ao andar 2', () => {
    const s = fresh(); const room = findRoom(s, 'boss'); goTo(s, room);
    assert(room.enemies.length === 1 && room.enemies[0].type === 'boss', 'sem chefão');
    room.enemies[0].hp = 0; s.player.x = G.W / 2; s.player.y = G.H / 2 + 150;
    G.update(s, DT);
    assert(room.cleared && room.trapdoor, 'sem alçapão');
    noXp(s);
    key(s, 'KeyW', true);
    for (let i = 0; i < 120 && s.floor === 1; i++) G.update(s, DT);
    assert(s.floor === 2 && s.cur.x === 0 && s.cur.y === 0, 'andar ' + s.floor);
  });
  test('vencer o chefão do andar 10 = vitória (andares antes não)', () => {
    for (const floor of [3, 9]) {
      const s = fresh(); s.floor = floor; G.generateFloor(s);
      const room = findRoom(s, 'boss'); goTo(s, room);
      room.enemies[0].hp = 0; G.update(s, DT);
      assert(s.status === 'playing' && room.trapdoor, 'andar ' + floor + ': ' + s.status);
    }
    const s = fresh(); s.floor = G.MAX_FLOOR; G.generateFloor(s);
    const room = findRoom(s, 'boss'); goTo(s, room);
    assert(room.bossKind === 'hipercubo', 'andar 10 sem o Big Boss: ' + room.bossKind);
    room.enemies[0].hp = 0; G.update(s, DT);
    assert(s.status === 'won', s.status);
  });

  // ---------- Geração de andares ----------
  test('400 mapas gerados (10 andares) são válidos e conectados', () => {
    for (let seed = 1; seed <= 40; seed++) {
      for (let floor = 1; floor <= G.MAX_FLOOR; floor++) {
        const s = G.createState(seed); s.floor = floor; G.generateFloor(s);
        const rooms = Object.values(s.rooms);
        assert(rooms.length === G.FLOORS[floor - 1].rooms, 'seed ' + seed + ' salas ' + rooms.length);
        assert(rooms.filter(r => r.type === 'boss').length === 1, 'chefão');
        assert(rooms.filter(r => r.type === 'item').length === 1, 'item');
        assert(rooms.filter(r => r.type === 'shop').length === 1, 'loja');
        const pool = G.FLOORS[floor - 1].pool;
        for (const r of rooms) for (const sp of r.spawns) assert(sp.type === 'boss' || pool[sp.type], 'andar ' + floor + ' com ' + sp.type);
        assert(s.rooms['0,0'].type === 'start', 'início');
        const seen = new Set(['0,0']); const q = [s.rooms['0,0']];
        while (q.length) {
          const r = q.shift();
          for (const k in r.doors) {
            const n = s.rooms[G.rk(r.x + G.DIRS[k].dx, r.y + G.DIRS[k].dy)];
            assert(n, 'porta para o nada');
            const back = { up: 'down', down: 'up', left: 'right', right: 'left' }[k];
            assert(n.doors[back], 'porta sem volta');
            if (!seen.has(G.rk(n.x, n.y))) { seen.add(G.rk(n.x, n.y)); q.push(n); }
          }
        }
        assert(seen.size === rooms.length, 'sala inacessível');
        for (const r of rooms) {
          for (const rock of r.rocks) {
            assert(!(rock.c >= 9 && rock.c <= 12) && !(rock.r >= 5 && rock.r <= 7), 'pedra bloqueando corredor');
          }
          for (const sp of r.spawns) assert(!r.rocks.some(rock => rock.c === sp.c && rock.r === sp.r), 'inimigo na pedra');
        }
      }
    }
  });

  // ---------- Desenho e inicialização ----------
  test('render não quebra em nenhum estado', () => {
    const c = document.createElement('canvas'); c.width = G.W; c.height = G.SCREEN_H;
    const ctx = c.getContext('2d');
    const s = fresh(); G.render(ctx, s);
    for (const type of ['boss', 'item', 'normal']) { goTo(s, findRoom(s, type)); steps(s, 1); G.render(ctx, s); }
    s.paused = true; G.render(ctx, s); s.paused = false;
    s.status = 'dead'; G.render(ctx, s); s.status = 'won'; G.render(ctx, s);
  });
  test('start() liga o teclado da janela', () => {
    const c = document.createElement('canvas'); c.width = G.W; c.height = G.SCREEN_H;
    const s = G.start(c);
    assert(s.status === 'menu', 'não começou no menu');
    window.dispatchEvent(keyEvt('keydown', 'Enter')); window.dispatchEvent(keyEvt('keyup', 'Enter'));
    assert(s.status === 'playing', 'Enter na janela não iniciou');
    window.dispatchEvent(keyEvt('keydown', 'KeyD')); assert(s.keys.KeyD, 'window keydown');
    window.dispatchEvent(keyEvt('keyup', 'KeyD')); assert(!s.keys.KeyD, 'window keyup');
  });

  // =================== TEXTURAS ===================
  function stats(canvas, x0, y0, w, h) {
    const d = canvas.getContext('2d').getImageData(x0 || 0, y0 || 0, w || canvas.width, h || canvas.height).data;
    let r = 0, g = 0, b = 0, a = 0, n = 0, op = 0, sL = 0, sL2 = 0;
    for (let i = 0; i < d.length; i += 4) {
      n++; a += d[i + 3];
      if (d[i + 3] > 10) { op++; r += d[i]; g += d[i + 1]; b += d[i + 2]; const L = (d[i] + d[i + 1] + d[i + 2]) / 3; sL += L; sL2 += L * L; }
    }
    const o = Math.max(1, op), mL = sL / o;
    return { r: r / o, g: g / o, b: b / o, alpha: a / n, coverage: op / n, lum: mL, std: Math.sqrt(Math.max(0, sL2 / o - mL * mL)) };
  }
  function hue(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    if (!d) return 0;
    let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60; return h < 0 ? h + 360 : h;
  }
  function px(canvas, x, y) { return canvas.getContext('2d').getImageData(Math.round(x), Math.round(y), 1, 1).data; }
  const T = G.buildTextures();

  test('textura: todas existem com o tamanho certo', () => {
    const fw = G.IX1 - G.IX0, fh = G.IY1 - G.IY0;
    const exp = { sky: [G.W, G.SCREEN_H], bubble: [64, 64], tear: [32, 32], bullet: [32, 32], fly: [32, 32],
      orbiter: [32, 32], turret: [32, 32], duke: [64, 64], heart: [32, 32], heartEmpty: [32, 32],
      queen: [64, 64], spinner: [32, 32], bomber: [32, 32], healer: [32, 32], coin: [24, 24], xp: [16, 16] };
    for (const b of G.BIOMES) { exp['floor_' + b.id] = [fw, fh]; exp['wall_' + b.id] = [fw, G.WALL_H]; }
    for (const k in exp) {
      assert(T[k], 'faltando ' + k);
      assert(T[k].width === exp[k][0] && T[k].height === exp[k][1], k + ' tamanho ' + T[k].width + 'x' + T[k].height);
    }
  });
  test('textura: nenhuma está vazia ou lisa', () => {
    for (const k in T) {
      const st = stats(T[k]);
      assert(st.coverage > 0.3, k + ' vazia (' + st.coverage.toFixed(2) + ')');
      assert(st.std > 3, k + ' sem detalhe (desvio ' + st.std.toFixed(1) + ')');
    }
  });
  test('textura: chão de cada bioma tem a cor Aero do tema', () => {
    const ranges = { lagoa: [170, 215], prado: [70, 140], ceu: [200, 250], cristal: [245, 285], nucleo: [315, 350] };
    for (const b of G.BIOMES) {
      const st = stats(T['floor_' + b.id]), h = hue(st.r, st.g, st.b);
      assert(h >= ranges[b.id][0] && h <= ranges[b.id][1], b.id + ' matiz ' + h.toFixed(0));
      assert(st.lum > 150, b.id + ' escuro demais (' + st.lum.toFixed(0) + ')');
    }
  });
  test('textura: céu é azul e clareia para baixo', () => {
    const top = stats(T.sky, 400, 0, 400, 40), bottom = stats(T.sky, 400, G.SCREEN_H - 120, 400, 40);
    assert(top.b > top.r + 60, 'topo não é azul');
    assert(bottom.lum > top.lum, 'não clareia');
  });
  test('textura: bolha é redonda e transparente no meio', () => {
    const b = T.bubble;
    assert(px(b, 1, 1)[3] === 0 && px(b, 62, 62)[3] === 0, 'cantos não transparentes');
    const center = px(b, 32, 32)[3];
    assert(center > 3 && center < 120, 'centro alpha ' + center);
    assert(px(b, 32, 61)[3] > 120, 'borda fraca ' + px(b, 32, 61)[3]);
  });
  test('textura: orbes têm brilho no topo (efeito vidro)', () => {
    for (const k of ['tear', 'bullet', 'fly', 'orbiter', 'turret', 'duke', 'queen', 'spinner', 'bomber', 'healer', 'coin', 'xp']) {
      const s = T[k].width, top = stats(T[k], 0, 0, s, s / 3), bot = stats(T[k], 0, s * 2 / 3, s, s / 3);
      assert(top.lum > bot.lum + 15, k + ' sem brilho (' + top.lum.toFixed(0) + ' vs ' + bot.lum.toFixed(0) + ')');
    }
  });
  test('textura: coração é rosa/vermelho', () => {
    const st = stats(T.heart);
    assert(st.r > st.g + 40 && st.r > st.b, 'cor ' + [st.r, st.g, st.b].map(Math.round));
  });
  test('textura: parede de vidro tem reflexo em cima', () => {
    for (const b of G.BIOMES) {
      const w = T['wall_' + b.id], q = w.height / 4;
      assert(stats(w, 0, 0, w.width, q).lum > stats(w, 0, w.height - q, w.width, q).lum, b.id);
    }
  });
  test('textura: geradas uma vez só (cache)', () => { assert(G.buildTextures() === T, 'regerou'); });

  // =================== 2.5D ===================
  test('2.5D: fundo da sala é mais estreito que a frente', () => {
    const back = G.proj(G.IX1, G.IY0, 0).x - G.proj(G.IX0, G.IY0, 0).x;
    const front = G.proj(G.IX1, G.IY1, 0).x - G.proj(G.IX0, G.IY1, 0).x;
    assert(back < front * 0.9, back + ' vs ' + front);
    assert(G.proj(300, 300, 20).y < G.proj(300, 300, 0).y, 'altura não sobe na tela');
  });
  test('2.5D: sala inteira cabe na tela, abaixo do HUD', () => {
    assert(G.proj(0, 0, G.WALL_H).y > G.HUD, 'parede invade HUD');
    assert(G.proj(G.W, G.H, 0).y < G.SCREEN_H, 'frente sai da tela');
    assert(G.proj(0, 0, 0).x >= 0 && G.proj(G.W, G.H, 0).x <= G.W, 'sai pelos lados');
  });
  function frame(s) {
    const c = document.createElement('canvas'); c.width = G.W; c.height = G.SCREEN_H;
    s.shake = 0; s.msg = null; G.render(c.getContext('2d'), s); return c;
  }
  test('2.5D: render mostra céu, chão Aero e o bloco azul', () => {
    const s = fresh(); s.time = 0; const c = frame(s);
    const sky = stats(c, 5, 80, 20, 20); assert(sky.b > sky.r + 40, 'céu ' + [sky.r, sky.g, sky.b].map(Math.round));

  function typeCode(s, t, text, numpad) {
    for (const ch of text) {
      const code = (numpad ? 'Numpad' : 'Digit') + ch;
      t.dispatchEvent(keyEvt('keydown', code)); t.dispatchEvent(keyEvt('keyup', code));
    }
  }
  function cheatState() {
    const s = menuState(); const t = new EventTarget(); G.bindInput(s, t);
    typeCode(s, t, '1234'); return { s, t };
  }

  // ---------- testes assíncronos: renderiza o áudio de verdade (sem tocar) ----------
  const pending = [];
  function testAsync(name, fn) {
    pending.push(Promise.resolve().then(fn).then(
      () => results.push('PASS ' + name),
      e => results.push('FAIL ' + name + ' -> ' + (e && e.message || e))));
  }
  function bands(buf) {
    const d = buf.getChannelData(0), n = 40; let lo = 0, hi = 0, all = 0, peak = 0, acc = 0;
    for (let i = 0; i < d.length; i++) {
      acc += d[i]; if (i >= n) acc -= d[i - n];
      const l = acc / n, h = d[i] - l;
      lo += l * l; hi += h * h; all += d[i] * d[i]; peak = Math.max(peak, Math.abs(d[i]));
    }
    return { rms: Math.sqrt(all / d.length), lo: Math.sqrt(lo / d.length), hi: Math.sqrt(hi / d.length), peak };
  }
  function windowPeak(buf, t0, t1) {
    const d = buf.getChannelData(0), sr = buf.sampleRate, n = 40; let acc = 0, peak = 0;
    for (let i = Math.floor(t0 * sr) - n; i < t1 * sr; i++) { acc += d[i]; if (i - n >= 0) acc -= d[i - n]; if (i >= t0 * sr) peak = Math.max(peak, Math.abs(acc / n)); }
    return peak;
  }
  const audio = M.renderOffline(2, 0);
  testAsync('música (áudio): 2 compassos têm som e não estouram', () => audio.then(buf => {
    const b = bands(buf);
    assert(b.rms > 0.02, 'muito baixo: ' + b.rms.toFixed(4));
    assert(b.peak <= 1, 'estourou: ' + b.peak.toFixed(2));
  }));
  testAsync('música (áudio): tem grave (bumbo/808) e agudo (chimbal/sinos)', () => audio.then(buf => {
    const b = bands(buf);
    assert(b.lo > 0.02, 'sem grave ' + b.lo.toFixed(4)); assert(b.hi > 0.004, 'sem agudo ' + b.hi.toFixed(4));
  }));
  testAsync('música (áudio): o bumbo bate forte no tempo 1', () => audio.then(buf => {
    const one = windowPeak(buf, 0.02, 0.12), off = windowPeak(buf, 0.02 + M.STEP * 2, 0.02 + M.STEP * 2 + 0.1);
    assert(one > off * 1.3, 'tempo 1 ' + one.toFixed(3) + ' vs contratempo ' + off.toFixed(3));
  }));
  testAsync('música (áudio): versão de chefão é mais intensa', () => Promise.all([audio, M.renderOffline(2, 1)]).then(([calm, boss]) => {
    const a = bands(calm), b = bands(boss);
    assert(b.rms > a.rms && b.hi > a.hi, 'não ficou mais forte: rms ' + a.rms.toFixed(4) + ' -> ' + b.rms.toFixed(4));
    // no passo 2 só o modo chefão tem stab de cordas: ali a diferença tem que ser clara
    const winRms = (buf, t0) => {
      const d = buf.getChannelData(0), sr = buf.sampleRate; let sum = 0, n = 0;
      for (let i = Math.floor(t0 * sr); i < (t0 + 0.15) * sr; i++) { sum += d[i] * d[i]; n++; }
      return Math.sqrt(sum / n);
    };
    const t2 = 0.02 + M.STEP * 2, ca = winRms(calm, t2), cb = winRms(boss, t2);

  window.testResults = Promise.all(pending).then(() => {
    const fails = results.filter(r => r.startsWith('FAIL')).length;
    results.push('', 'TOTAL ' + results.length + ' | FALHAS ' + fails);
    const text = results.join('\n');
    document.getElementById('out').textContent = text;
    return text;
  });
})();
</script>
