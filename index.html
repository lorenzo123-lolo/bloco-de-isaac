<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Bloco de Isaac</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 20% 0%, #e9fbff 0%, #7fd0f5 35%, #1b7fd4 75%, #0c4f8f 100%);
      /* no celular: sem zoom, rolagem, seleção de texto ou menu de toque longo */
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      max-width: 100vw; max-height: 100vh; max-height: 100dvh;
      border-radius: 18px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.85), 0 12px 40px rgba(5,50,100,0.45);
    }
    /* celular em pé: pede para girar (o jogo é horizontal) */
    #rotate { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate {
        display: flex; position: fixed; inset: 0; z-index: 1;
        flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: rgba(12,79,143,0.92); color: #e9fbff;
        font: 600 22px "Segoe UI", "Trebuchet MS", Arial, sans-serif; text-align: center;
      }
      #rotate span { font-size: 64px; }
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="600" tabindex="0"></canvas>
  <div id="rotate"><span>⟳</span>Gire o celular para jogar</div>
  <script src="music.js"></script>
  <script src="progress.js"></script>
  <script src="game.js"></script>
</body>
</html>
